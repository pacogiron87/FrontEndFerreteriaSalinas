<p-dialog [header]="modalTitle()" [(visible)]="isModalVisible" [modal]="true" [style]="{width: '60vw'}"
  [breakpoints]="{'960px': '90vw'}" styleClass="modern-modal">

  <form [formGroup]="customerForm" (ngSubmit)="onSaveChanges()" class="product-form">

    <div class="form-grid" style="grid-template-columns: repeat(2, 1fr);">

      <!-- Nombre completo -->
      <div class="form-field">
        <p-floatLabel>
          <input pInputText id="customerName" formControlName="name" class="fluid-input" />
          <label for="customerName">Nombre completo*</label>
        </p-floatLabel>
      </div>

      <!-- Negocio / Alias -->
      <div class="form-field">
        <p-floatLabel>
          <input pInputText id="customerBusinessName" formControlName="businessName" class="fluid-input" />
          <label for="customerBusinessName">Negocio / Alias</label>
        </p-floatLabel>
      </div>

      <!-- Departamento -->
      <div class="form-field">
        <p-floatLabel>
          <p-select inputId="customerDept" [options]="states()" formControlName="departmentAddress" optionLabel="state"
            optionValue="state" styleClass="fluid-input">
          </p-select>
          <label for="customerDept">Departamento*</label>
        </p-floatLabel>
      </div>

      <!-- Municipio -->
      <div class="form-field">
        <p-floatLabel>
          <p-select inputId="customerMun" [options]="cities()" formControlName="municipality" optionLabel="city"
            optionValue="city" styleClass="fluid-input">
          </p-select>
          <label for="customerMun">Municipio*</label>
        </p-floatLabel>
      </div>

      <!-- Dirección (Toma 2 columnas) -->
      <div class="form-field" style="grid-column: span 2;">
        <p-floatLabel>
          <input pInputText id="customerAddress" formControlName="address" class="fluid-input" />
          <label for="customerAddress">Dirección*</label>
        </p-floatLabel>
      </div>

      <!-- Giro / Actividad (Toma 2 columnas) -->
      <div class="form-field" style="grid-column: span 2;">
        <p-floatLabel>
          <p-autoComplete inputId="customerActivity" formControlName="codeActivitie"
            [suggestions]="filteredCodeActivities()" (completeMethod)="filterCodeActivity($event)" field="displayField"
            (onSelect)="onSelectActivity($event)" styleClass="fluid-input fluid-autocomplete">
          </p-autoComplete>
          <label for="customerActivity">Giro / Actividad</label>
        </p-floatLabel>
      </div>

    </div>

    <!-- Toggles (Retencion y Gran Contribuyente) -->
    <div class="flex gap-4 pt-3 pb-2">
      <div class="flex flex-column gap-2">
        <label class="font-bold text-sm text-gray-600">Retención (1%)</label>
        <p-toggleswitch formControlName="isRetentionTax"></p-toggleswitch>
      </div>
      <div class="flex flex-column gap-2">
        <label class="font-bold text-sm text-gray-600">Gran Contribuyente</label>
        <p-toggleswitch formControlName="IsMajorTaxpayer"></p-toggleswitch>
      </div>
    </div>

    <!-- Acciones -->
    <div class="form-actions mt-4 pt-4 border-top-1 border-gray-100 flex justify-content-end gap-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="isModalVisible.set(false)" size="large">
      </p-button>
      <p-button label="Guardar" severity="primary" type="submit" [disabled]="customerForm.invalid" size="large">
      </p-button>
    </div>

  </form>
</p-dialog>
