<p-toast></p-toast>

<div class="p-4 bg-gray-50 min-h-screen">
  <div class="p-card shadow-lg border-round overflow-hidden mb-4">
    <div class="p-card-header p-3 bg-primary text-white flex justify-content-between align-items-center">
      <div class="flex align-items-center gap-3">
        <i class="fa-solid fa-hashtag text-2xl"></i>
        <span class="text-xl font-bold uppercase tracking-wider">Resoluciones Fiscales</span>
      </div>
      <p-button label="Nueva Resolución" icon="pi pi-plus" severity="success" (onClick)="toggleModal()"></p-button>
    </div>

    <div class="p-card-body p-4">
      <p-table #dt [loading]="loading()" [value]="resolutions()" [rowHover]="true" [paginator]="true" [rows]="10" styleClass="p-datatable-sm p-datatable-striped shadow-1">
        <ng-template pTemplate="header">
          <tr>
            <th class="text-center">Opciones</th>
            <th>Tipo</th>
            <th>Número</th>
            <th class="text-center">Inicio</th>
            <th class="text-center">Fin</th>
            <th class="text-center">Estado</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-resolution>
          <tr>
            <td class="text-center"><p-button icon="pi pi-pencil" severity="warn" size="small" [rounded]="true" (onClick)="toggleModal(resolution)"></p-button></td>
            <td>{{resolution.bill_type}}</td>
            <td>{{resolution.resolution_number}}</td>
            <td class="text-center">{{resolution.start_number}}</td>
            <td class="text-center">{{resolution.end_number}}</td>
            <td class="text-center">
              <p-tag [value]="resolution.status ? 'Activa' : 'Inactiva'" [severity]="resolution.status ? 'success' : 'danger'" [rounded]="true"></p-tag>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="6" class="text-center p-5 text-gray-400 italic">No hay resoluciones registradas.</td></tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<p-dialog [header]="modalTitle()" [(visible)]="isModalVisible" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="resolutionForm" (ngSubmit)="saveChanges()" class="p-fluid mt-3">
    <div class="field mb-3"><label class="font-bold">Tipo*</label><p-select [options]="invoiceTypes" formControlName="bill_type" optionLabel="description" optionValue="description"></p-select></div>
    <div class="field mb-3"><label class="font-bold">Número*</label><input pInputText formControlName="resolution_number" /></div>
    <div class="field mb-3"><label class="font-bold">Número CU*</label><input pInputText formControlName="resolution_number_cu" /></div>
    <div class="field mb-3"><label class="font-bold">Inicial*</label><p-inputNumber formControlName="start_number"></p-inputNumber></div>
    <div class="field mb-3"><label class="font-bold">Final*</label><p-inputNumber formControlName="end_number"></p-inputNumber></div>
    <div class="flex justify-content-end gap-2 pt-3 border-top-1 border-gray-100 mt-4">
      <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="isModalVisible.set(false)"></p-button>
      <p-button label="Guardar" icon="pi pi-save" severity="primary" type="submit" [disabled]="resolutionForm.invalid"></p-button>
    </div>
  </form>
</p-dialog>
