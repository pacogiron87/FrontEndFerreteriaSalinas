<!--Notifications-->
<p-toast></p-toast>
<!--Table-->
<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-header>
        <em class="fa-solid fa-users"></em> <strong>Clientes</strong>
      </c-card-header>
      <c-card-body>
        <p-table #dt
                 [loading]="loading"
                 [value]="customers"
                 [rowHover]="true"
                 [paginator]="true"
                 [rows]="10"
                 [showCurrentPageReport]="true"
                 [rowsPerPageOptions]="[10,25,50]"
                 currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} registros"
                 dataKey="id"
                 responsiveLayout="scroll"
                 styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped"
                 [globalFilterFields]="['name','address','mobile','status']"
        >
          <ng-template pTemplate="caption">
            <div class="d-flex justify-content-between">
              <button cButton color="dark" (click)="customerModal.toggleModal()" pTooltip="Agregar cliente"
                      tooltipPosition="right">
                <em class="fa-solid fa-circle-plus pe-2"></em>Agregar
              </button>
              <span class="p-input-icon-left ml-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                           placeholder="Buscar"/>
                </span>
            </div>
          </ng-template>
          <ng-template pTemplate="header">
            <tr>
              <th scope="col" class="text-center">Opciones</th>
              <th scope="col" class="text-center" pSortableColumn="name">Nombre
                <p-sortIcon field="name"></p-sortIcon>
              </th>
              <th scope="col" class="text-center" pSortableColumn="address">Direccion
                <p-sortIcon field="address"></p-sortIcon>
              </th>
              <th scope="col" class="text-center" pSortableColumn="mobile">Celular
                <p-sortIcon field="mobile"></p-sortIcon>
              </th>
              <th scope="col" class="text-center" pSortableColumn="status">Estado
                <p-sortIcon field="status"></p-sortIcon>
              </th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-customer>
            <tr>
              <td class="text-center">
                <button cButton color="warning" size="sm" pTooltip="Editar cliente" tooltipPosition="top"
                        (click)="customerModal.toggleModal(customer)"><em class="fa-solid fa-pen"></em></button>
                <button cButton color="danger" size="sm" pTooltip="Desactivar cliente" tooltipPosition="top"
                        *ngIf="customer.status" (click)="changeStatus(customer, false)">
                  <em class="fa-solid fa-trash"></em></button>
                <button cButton color="info" size="sm" pTooltip="Activar cliente" tooltipPosition="top"
                        *ngIf="!customer.status" (click)="changeStatus(customer, true)">
                  <em class="fa-solid fa-trash-arrow-up"></em></button>
              </td>
              <td>{{customer.name}}</td>
              <td>{{customer.address}}</td>
              <td>{{customer.mobile}}</td>
              <td class="text-center">
                <c-badge
                  [color]="utilitiesService.getFromStatus(customer.status)">{{utilitiesService.getFromStatus(customer.status, statusTypeData.NAME)}}</c-badge>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
<!--Modal-->
<app-customer-modal
  (sendCustomer)="saveChanges($event)"
></app-customer-modal>
